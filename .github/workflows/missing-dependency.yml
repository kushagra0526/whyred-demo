name: missing-dependency

on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/missing-dependency.js
