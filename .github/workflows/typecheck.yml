name: typecheck

on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }

jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes -p typescript@5 tsc --noEmit src/broken.ts
