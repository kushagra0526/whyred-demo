name: lint

on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes eslint@8 src/lint-error.js
